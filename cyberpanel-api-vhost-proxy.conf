# LiteSpeed/CyberPanel: add this block to the api.pantherarestolounge.com vhost
# so all requests are proxied to the Node app on port 5000.
# Place it after the "rewrite" block (or before "context /.well-known").
# Then restart/reload LiteSpeed from CyberPanel.

context / {
  type                    proxy
  handler                 http://127.0.0.1:5000
  addDefaultCharset       off
}
