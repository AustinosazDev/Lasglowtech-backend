# Upload files to cPanel via FTP on push to main.

on:
  push:
    branches:
      - main

name: Deploy to cPanel

jobs:
  deploy:
    name: Upload files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./server/
          server-dir: ${{ format('{0}/', secrets.FTP_SERVER_DIR) }}
          dangerous-clean-slate: false

# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_PROTOCOL, FTP_PORT, FTP_SERVER_DIR (path without trailing slash; workflow adds /)
