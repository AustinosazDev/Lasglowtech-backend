# VPS deploy: SSH in, fetch + reset --hard (all tracked files replaced with repo), npm ci, PM2 restart.
# Uses a key file (with newline fix) to avoid "unable to authenticate" from inline key parsing.

on:
  push:
    branches:
      - main

name: Deploy to VPS

jobs:
  deploy:
    name: Deploy and start app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy via SSH (replace files from repo, npm ci, PM2 restart)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | sed 's/\\r\\n/\n/g' | sed 's/\\n/\n/g' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Bake token and repo into the URL on the runner so the remote gets the full URL (remote shell has no AUTH_TOKEN/GITHUB_REPOSITORY)
          DEPLOY_CMD="cd ~/backend/Lasglowblog && git fetch https://x-access-token:${AUTH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git main && git reset --hard FETCH_HEAD && npm ci --omit=dev && (pm2 restart lasglowblog-api --env production || pm2 start ecosystem.config.cjs --env production) && pm2 save"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" "su - austinosaz -c \"$DEPLOY_CMD\""
        timeout-minutes: 10

# Required secrets: SSH_HOST, SSH_USER (e.g. root), SSH_PRIVATE_KEY (full private key content), AUTH_TOKEN (GitHub PAT).
# Optional: SSH_PORT (default 22). Ensure root@VPS has the matching PUBLIC key in ~/.ssh/authorized_keys.
