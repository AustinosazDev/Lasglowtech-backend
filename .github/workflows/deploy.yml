# VPS deploy: SSH in, fetch + reset --hard (all tracked files replaced with repo), npm ci, PM2 restart.

on:
  push:
    branches:
      - main

name: Deploy to VPS

jobs:
  deploy:
    name: Deploy and start app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy via SSH (replace files from repo, npm ci, PM2 restart)
        uses: appleboy/ssh-action@v1.0.3
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: AUTH_TOKEN,GITHUB_REPOSITORY
          script: |
            su - Austinosaz -c "cd ~/backend/Lasglowblog && git fetch https://x-access-token:${AUTH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git main && git reset --hard FETCH_HEAD && npm ci --omit=dev && (pm2 restart lasglowblog-api --env production || pm2 start ecosystem.config.cjs --env production) && pm2 save"

# Required secrets: SSH_HOST, SSH_USER (e.g. root), SSH_PRIVATE_KEY (full private key content), AUTH_TOKEN (GitHub PAT for git fetch).
# If SSH fails: ensure the PUBLIC key is in root@VPS authorized_keys: ssh-copy-id -i ~/.ssh/id_ed25519.pub root@IP
# Optional: SSH_PORT (default 22).
