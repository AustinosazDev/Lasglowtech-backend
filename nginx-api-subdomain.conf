# Nginx config for API subdomain. Copy to /etc/nginx/sites-available/api.pantherarestolounge.com
# then: sudo ln -sf /etc/nginx/sites-available/api.pantherarestolounge.com /etc/nginx/sites-enabled/
# Run: sudo certbot --nginx -d api.pantherarestolounge.com for HTTPS.

server {
    listen 80;
    server_name api.pantherarestolounge.com;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
